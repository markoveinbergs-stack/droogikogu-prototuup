<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4f3ef">
<title>TTK droogikogu – audiogiid</title>
<style>
:root {
  --bg:#f4f3ef; --card:#ffffff; --text:#18201b; --muted:#687168;
  --accent:#315b43; --line:#d9ddd8; --soft:#eef2ee;
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);line-height:1.45}
main{max-width:760px;margin:0 auto;padding:34px 18px 60px}
.kicker{text-transform:uppercase;letter-spacing:1.2px;font-size:13px;color:var(--muted);margin-bottom:22px}
h1{font-size:clamp(2rem,7vw,2.8rem);line-height:1.08;margin:0 0 12px}
.lead{font-size:1.05rem;color:var(--muted);margin:0 0 22px}
.toolbar{display:flex;gap:10px;align-items:center;margin:20px 0 14px}
.search{width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px 16px;font-size:16px;outline:none}
.search:focus{border-color:#8aa28f;box-shadow:0 0 0 3px rgba(49,91,67,.08)}
.count{white-space:nowrap;color:var(--muted);font-size:14px}
.list{display:grid;gap:10px}
.item{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 17px;text-decoration:none;color:var(--text);transition:.12s}
.item:hover{transform:translateY(-1px);border-color:#bcc8be}
.item strong{display:block;font-size:1.06rem}
.item .sub{display:block;color:var(--muted);margin-top:2px;font-family:Georgia,serif;font-style:italic}
.item .meta{display:block;color:#7b837d;margin-top:3px;font-size:.84rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px}
.code{font-size:.8rem;font-weight:700;letter-spacing:.09em;color:var(--accent)}
.card h1{font-size:clamp(1.9rem,7vw,2.6rem);margin:.45rem 0 .3rem}
.latin{font-family:Georgia,serif;font-style:italic;font-size:1.18rem;margin-bottom:.35rem}
.plant{color:var(--muted);margin:.2rem 0 1.4rem}
.listen{border-top:1px solid var(--line);padding-top:1.25rem;margin-top:1.1rem}
audio{width:100%;margin-top:.65rem}
.actions{display:flex;gap:14px;flex-wrap:wrap;margin-top:18px}
a.textlink{color:var(--accent);text-underline-offset:3px}
.note{background:var(--soft);border-radius:12px;padding:11px 13px;color:var(--muted);font-size:.9rem;margin-top:18px}
footer{margin-top:28px;color:var(--muted);font-size:.86rem}
.hidden{display:none!important}
.empty{color:var(--muted);padding:20px 2px}
@media(max-width:520px){main{padding-top:25px} .toolbar{align-items:stretch;flex-direction:column} .count{padding-left:2px}}
</style>
</head>
<body>
<main>
  <div class="kicker">Tallinna Tervishoiu Kõrgkool · droogikogu</div>
  <div id="app"></div>
  <footer>Õppeotstarbeline audiogiid · 59 taimejuttu</footer>
</main>

verified":false},{"id":"D055","name":"Verev sõrmkübar","latin":"","plant":"","audio":"Farmakopöa_Verev_sõrmkübar.mp3","verified":false},{"id":"D056","name":"õlipuu","latin":"","plant":"","audio":"Farmakopöa_õlipuu.mp3","verified":false},{"id":"D057","name":"Üheksavägine","latin":"","plant":"","audio":"Farmakopöa_Üheksavägine.mp3","verified":false},{"id":"D058","name":"Ürt-penimünt","latin":"","plant":"","audio":"Farmakopöa_Ürt-penimünt.mp3","verified":false},{"id":"D059","name":"Ürt-punanupp","latin":"","plant":"","audio":"Farmakopöa_Ürt-punanupp.mp3","verified":false}];

const byId = Object.fromEntries(DROOGID.map(d => [d.id, d]));
const params = new URLSearchParams(location.search);
const selectedId = (params.get("d") || "").toUpperCase();
const app = document.getElementById("app");

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}

function showDetail(d) {
  document.title = `${d.name} · TTK droogikogu`;
  const latin = d.latin ? `<div class="latin">${esc(d.latin)}</div>` : "";
  const plant = d.plant ? `<p class="plant">Lähtetaim: <i>${esc(d.plant)}</i></p>` : "";
  app.innerHTML = `
    <article class="card">
      <div class="code">${esc(d.id)}</div>
      <h1>${esc(d.name)}</h1>
      ${latin}
      ${plant}
      <div class="listen">
        <strong>🎧 Kuula taimejuttu</strong>
        <audio controls preload="metadata">
          <source src="${encodeURI(d.audio)}" type="audio/mpeg">
          Sinu brauser ei toeta audiopleierit.
        </audio>
      </div>
    </article>
    <div class="actions">
      <a class="textlink" href="./">← Kõik taimejutud</a>
      <a class="textlink" href="${encodeURI(d.audio)}" target="_blank" rel="noopener">Ava helifail</a>
    </div>`;
}

function showList() {
  document.title = "TTK droogikogu – audiogiid";
  app.innerHTML = `
    <h1>Droogikogu audiogiid</h1>
    <p class="lead">Vali taimejutt või otsi nime järgi.</p>
    <div class="toolbar">
      <input id="q" class="search" type="search" autocomplete="off" placeholder="Otsi taime või D-koodi…" aria-label="Otsi taimejuttu">
      <div id="count" class="count"></div>
    </div>
    <div id="list" class="list"></div>
    <div id="empty" class="empty hidden">Vastet ei leitud.</div>`;
  const q = document.getElementById("q");
  const list = document.getElementById("list");
  const count = document.getElementById("count");
  const empty = document.getElementById("empty");

  function render() {
    const term = q.value.trim().toLocaleLowerCase("et");
    const rows = DROOGID.filter(d =>
      !term ||
      d.id.toLocaleLowerCase("et").includes(term) ||
      d.name.toLocaleLowerCase("et").includes(term) ||
      (d.latin || "").toLocaleLowerCase("et").includes(term)
    );
    count.textContent = `${rows.length} / ${DROOGID.length}`;
    empty.classList.toggle("hidden", rows.length !== 0);
    list.innerHTML = rows.map(d => `
      <a class="item" href="?d=${encodeURIComponent(d.id)}">
        <strong>${esc(d.id)} · ${esc(d.name)}</strong>
        ${d.latin ? `<span class="sub">${esc(d.latin)}</span>` : `<span class="meta">Taimejutt</span>`}
      </a>`).join("");
  }
  q.addEventListener("input", render);
  render();
}

if (selectedId && byId[selectedId]) showDetail(byId[selectedId]);
else showList();
</script>
</body>
</html>
